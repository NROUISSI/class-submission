<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Urban Joint Airspace Walkthrough</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a left rail of eleven steps beside one stage that shows the current step, with a picture slot, notes drawer and pace timer. Flight-strip status tags. Palette follows the image style: off-white, deep blue, teal, apricot, lilac, one red accent. */
:root{
  --bg:#f3f5f8; --panel:#ffffff; --soft:#e9eef5; --ink:#14213d; --muted:#586279; --line:#cfd8e6;
  --teal:#0b8f87; --teal-t:#d2f1ee; --apricot:#e8864a; --apricot-t:#fde6d4; --lilac:#7a68d6; --lilac-t:#e6e1fa;
  --red:#d92b45; --red-t:#fbd9df; --blue:#2a62c4; --blue-t:#d9e5f9; --grey:#5b6472; --grey-t:#e3e7ee;
  --fa:#7c5cd6; --fb:#c2347f; --fc:#2a62c4; --fd:#d9405f; --ff:#5b6472;
  --f-body:'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1525; --panel:#142138; --soft:#1b2c48; --ink:#e7edf8; --muted:#a6b2c9; --line:#2b3d5e;
  --teal:#3fd0c6; --teal-t:#0f3d3c; --apricot:#f4a26f; --apricot-t:#4a2e1b; --lilac:#a99bf0; --lilac-t:#2e2866; --red:#ff6b81; --red-t:#4d1b27; --blue:#7fa8f0; --blue-t:#1b3158; --grey:#a6b2c9; --grey-t:#243249;
  --fa:#a58bff; --fb:#ee6fb0; --fc:#7fa8f0; --fd:#ff7d96; --ff:#a6b2c9; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1525; --panel:#142138; --soft:#1b2c48; --ink:#e7edf8; --muted:#a6b2c9; --line:#2b3d5e;
  --teal:#3fd0c6; --teal-t:#0f3d3c; --apricot:#f4a26f; --apricot-t:#4a2e1b; --lilac:#a99bf0; --lilac-t:#2e2866; --red:#ff6b81; --red-t:#4d1b27; --blue:#7fa8f0; --blue-t:#1b3158; --grey:#a6b2c9; --grey-t:#243249;
  --fa:#a58bff; --fb:#ee6fb0; --fc:#7fa8f0; --fd:#ff7d96; --ff:#a6b2c9; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
h1,h2,h3,p{margin:0}
.mono{font-family:var(--f-mono)}
.lab{font-family:var(--f-mono);font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted)}
.wrap{max-width:1280px;margin:0 auto}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.brand{font-weight:800;font-size:18px;letter-spacing:-.2px}
.brand small{display:block;font-family:var(--f-mono);font-weight:400;font-size:10.5px;letter-spacing:1.3px;color:var(--muted)}
.grow{flex:1}
.btn{border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:6px 12px;font-weight:600;font-size:14px;cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.red{background:var(--red);color:#fff;border-color:var(--red)}
.timer{font-family:var(--f-mono);font-size:13px;display:flex;align-items:center;gap:8px}
.pace{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--grey-t)}
.pace.ahead{background:var(--teal-t)} .pace.behind{background:var(--apricot-t)}

/* layout */
.shell{display:grid;grid-template-columns:210px minmax(0,1fr);gap:28px;padding-top:20px}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px);align-self:start;display:grid;gap:2px}
.rail .ph{margin:12px 0 4px}
.rail button{display:grid;grid-template-columns:26px 1fr;gap:6px;align-items:center;text-align:left;border:0;background:transparent;border-radius:10px;padding:6px 8px;cursor:pointer;font-size:14px;font-weight:500}
.rail button .n{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.rail button[aria-current=step]{background:var(--ink);color:var(--bg)}
.rail button[aria-current=step] .n{color:var(--bg)}
.rail button.seen .n::after{content:" ·";color:var(--teal)}
.stage{min-width:0}
.kick{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-bottom:10px}
h1{font-size:clamp(30px,4.4vw,52px);line-height:1.04;letter-spacing:-1.2px;font-weight:800;text-wrap:balance;max-width:20ch}
.plain{margin-top:16px;max-width:62ch;border-left:5px solid var(--teal);background:var(--panel);border-radius:0 12px 12px 0;padding:10px 16px;border-top:1.5px solid var(--line);border-right:1.5px solid var(--line);border-bottom:1.5px solid var(--line)}
.plain p{font-size:17px;color:var(--ink);margin-top:2px;text-wrap:pretty}
.lead{font-size:clamp(17px,1.7vw,20px);color:var(--muted);max-width:60ch;margin-top:12px;text-wrap:pretty}
.body{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:24px;margin-top:24px;align-items:start}
.body.one{grid-template-columns:minmax(0,1fr)}
.col{display:grid;gap:16px;min-width:0}
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:16px 18px}
.card h3{font-size:18px;font-weight:700;margin-bottom:4px}
.card p{color:var(--muted)}
.card.hl{border-color:var(--ink)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}

/* tags: flight strips */
.tag{display:inline-block;font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.8px;border-radius:6px;padding:2px 8px;border:1.5px solid transparent;white-space:nowrap}
.tag.DECIDED,.tag.DONE{background:var(--teal-t);color:var(--ink);border-color:var(--teal)}
.tag.PROVISIONAL{background:var(--apricot-t);color:var(--ink);border-color:var(--apricot)}
.tag.OPEN{background:var(--lilac-t);color:var(--ink);border-color:var(--lilac)}
.tag.UNVERIFIED{background:var(--red-t);color:var(--ink);border-color:var(--red)}
.tag.OPTIONAL{background:var(--grey-t);color:var(--ink);border-color:var(--grey)}
.tag.NEXT{background:var(--blue-t);color:var(--ink);border-color:var(--blue)}
.tag.DRAFT{background:var(--apricot-t);color:var(--ink);border-style:dashed;border-color:var(--apricot)}
.tag.plain{background:var(--soft);color:var(--ink);border-color:var(--line)}

/* picture slot */
.slot{border:2px dashed var(--line);border-radius:16px;background:var(--panel);overflow:hidden;position:relative}
.slot .ph{display:grid;place-items:center;text-align:center;padding:22px;color:var(--muted);gap:8px;min-height:200px}
.slot img{display:block;width:100%;height:auto}
.slot.has{border-style:solid}
.slot .cap{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:8px 12px;border-top:1.5px solid var(--line);background:var(--bg)}
.slot.over{border-color:var(--red);background:var(--red-t)}

.imgwrap{position:relative}
.pin{position:absolute;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;border:2px solid #14213d;background:rgba(255,255,255,.55);color:#14213d;font-family:var(--f-mono);font-weight:700;font-size:11px;display:grid;place-items:center;cursor:pointer;padding:0;box-shadow:0 1px 4px rgba(0,0,0,.25);opacity:.62;transition:opacity .15s,transform .15s,background .15s}
.fade0 .pin{width:28px;height:28px;font-size:13px;background:#fff;opacity:1;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.pin:hover,.pin:focus-visible{opacity:1;background:#fff}
.pin:hover{transform:translate(-50%,-50%) scale(1.2)}
.pin[aria-pressed=true]{background:var(--red);border-color:#fff;color:#fff;transform:translate(-50%,-50%) scale(1.25);z-index:2;opacity:1}
.leg{padding:12px 14px;border-top:1.5px solid var(--line);display:grid;gap:8px}
.leg .say{color:var(--ink);font-size:15px;text-wrap:pretty}
.leg ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.leg li button{display:grid;grid-template-columns:26px 1fr;gap:8px;width:100%;text-align:left;border:0;background:transparent;border-radius:8px;padding:5px 6px;cursor:pointer}
.leg li button[aria-pressed=true]{background:var(--soft)}
.leg .k{width:22px;height:22px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:11.5px;background:var(--panel)}
.leg li button[aria-pressed=true] .k{background:var(--red);border-color:var(--red);color:#fff}
.leg .ex{display:block;color:var(--muted);font-size:13.5px;line-height:1.35}
.zoomov{position:fixed;inset:0;z-index:60;background:rgba(8,14,28,.82);display:grid;place-items:center;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 12px max(12px,env(safe-area-inset-left,0px))}
.zbox{background:var(--panel);border-radius:16px;max-width:min(1500px,100%);max-height:100%;overflow:auto;display:grid;gap:8px;padding:12px 14px}
.zhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.zbody{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,340px);gap:14px;align-items:start}
.zimg{position:relative;display:inline-block;max-width:100%;justify-self:center}
.zimg img{display:block;max-width:100%;max-height:78vh;width:auto;height:auto;border-radius:10px}
.zleg .leg{border-top:0;padding:0}
.howto ol{margin:6px 0 0;padding-left:20px;color:var(--ink)}
.howto li{margin-bottom:4px}
.tagkey{display:grid;gap:6px}
.tagkey div{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}
.gl dt{font-weight:700;margin-top:10px}
.gl dd{margin:2px 0 0;color:var(--muted)}
@media (max-width:900px){.zbody{grid-template-columns:minmax(0,1fr)}}

.pin .pt{position:absolute;left:calc(100% + 6px);top:50%;transform:translateY(-50%);background:rgba(255,255,255,.8);color:#14213d;border:1px solid rgba(20,33,61,.5);border-radius:6px;padding:0 6px;font-family:var(--f-body);font-weight:700;font-size:11.5px;line-height:1.5;white-space:nowrap;pointer-events:none;opacity:1;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.pin .pt.hov{display:none}
.pin:hover .pt.hov,.pin:focus-visible .pt.hov{display:block;z-index:5}
.pin .pt.b{left:50%;top:calc(100% + 6px);transform:translateX(-50%)}
.pin .pt.t{left:50%;top:auto;bottom:calc(100% + 6px);transform:translateX(-50%)}
.pin .pt.l{left:auto;right:calc(100% + 6px)}
.pin .pt.t{left:50%;top:auto;bottom:calc(100% + 6px);transform:translateX(-50%)}
.imgwrap .pin .pt{font-size:10.5px;padding:0 5px;background:rgba(255,255,255,.9)}
.fmap{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px}
.band{border:2px solid var(--c);border-radius:16px;background:var(--panel);padding:12px;display:grid;gap:8px;align-content:start;min-width:0}
.band.base{grid-column:1/-1}
.band h3{font-size:18px;color:var(--ink)}
.band .wh{font-family:var(--f-mono);font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.band .bar{height:6px;border-radius:3px;background:var(--c)}
.chips2{display:flex;flex-wrap:wrap;gap:6px}
.fchip{border:1.5px solid var(--line);border-left:5px solid var(--c);background:var(--bg);border-radius:10px;padding:5px 9px;cursor:pointer;text-align:left;display:grid;gap:0;min-width:0;max-width:100%}
.fchip .fn{font-weight:600;font-size:14px;line-height:1.25}
.fchip .fs{font-family:var(--f-mono);font-size:10px;letter-spacing:.6px;color:var(--muted)}
.fchip .fs.PROVISIONAL{color:var(--apricot)} .fchip .fs.OPEN{color:var(--lilac)} .fchip .fs.UNVERIFIED{color:var(--red)} .fchip .fs.DECIDED{color:var(--teal)}
.fchip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fchip[aria-pressed=true] .fs{color:var(--bg)}
.fchip.dim{opacity:.28}
.ba svg{width:100%;height:auto;display:block;border-radius:12px;background:var(--soft)}
.ba text{font-family:var(--f-body)}
.baanim .mv{animation:mvA 2.6s cubic-bezier(.45,0,.35,1) backwards}
.baanim .fi{animation:fin .7s ease 2.5s backwards}
@keyframes mvA{from{transform:translateX(var(--d))}to{transform:none}}
@keyframes fin{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.baanim .mv,.baanim .fi{animation:none}}
.slot .acts{display:flex;gap:6px;flex-wrap:wrap}
.btn.sm{padding:3px 9px;font-size:12.5px;border-radius:8px}

/* agent map */
.map{width:100%;height:auto;display:block}
.map text{font-family:var(--f-body)}
.node{cursor:pointer}
.node rect{fill:var(--panel);stroke:var(--line);stroke-width:2}
.node.sel rect{stroke:var(--ink);stroke-width:3}
.node:focus-visible rect{stroke:var(--red);stroke-width:3}
.node.h rect{fill:var(--lilac-t)} .node.n rect{fill:var(--teal-t)} .node.m rect{fill:var(--blue-t)}
.node .t1{font-weight:700;font-size:13.5px;fill:var(--ink)} .node .t2{font-size:11.5px;fill:var(--muted)}
.edge{stroke:var(--muted);stroke-width:1.8;fill:none;stroke-dasharray:6 5;transition:opacity .4s}
.edge.cur{stroke-width:3.5;stroke-dasharray:none}.edge.dim,.elab.dim{opacity:.18}
.node{transition:opacity .4s}.node.dim{opacity:.22}.node.on rect{stroke:var(--ink);stroke-width:3}
.elab{font-family:var(--f-mono);font-size:14px;font-weight:600;fill:var(--ink)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;border:1.5px solid var(--line);margin-right:6px;vertical-align:-1px}
.absent{border:2px dashed var(--red);border-radius:12px;padding:10px 12px;background:transparent}
.absent b{color:var(--ink)}
.absent .num{font-family:var(--f-mono);color:var(--red);font-weight:600}

/* phases */
.phases{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.phase{text-align:left;border:1.5px solid var(--line);background:var(--panel);border-radius:16px;padding:14px 16px;cursor:pointer;display:grid;gap:6px}
.phase[aria-pressed=true]{border-color:var(--ink);box-shadow:0 0 0 3px var(--soft)}
.phase h3{font-size:22px;font-weight:800;letter-spacing:-.4px}
.moves{display:flex;flex-wrap:wrap;gap:6px}
.moves span{font-size:12.5px;padding:2px 9px;border-radius:999px;background:var(--soft)}

/* tabs */
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:14px}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:0}

/* tables */
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1.5px solid var(--line);vertical-align:top}
th{font-family:var(--f-mono);font-size:11px;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted);font-weight:500}
tr.win td{background:var(--teal-t);font-weight:600}
.tw{overflow-x:auto}

/* constraints */
.cons{display:grid;gap:8px}
.cons button{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 12px;cursor:pointer}
.cons button[aria-expanded=true]{border-color:var(--ink)}
.cons .a{display:none;grid-column:2/4;color:var(--muted);padding-bottom:2px}
.cons button[aria-expanded=true] .a{display:block}
.cons .q{font-weight:600}

/* flow */
.flow{width:100%;height:auto;display:block}
.flow text{font-family:var(--f-body)}
.steps{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.steps li button{width:100%;text-align:left;display:grid;grid-template-columns:28px 1fr;gap:8px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel);padding:8px 10px;cursor:pointer}
.steps li button[aria-current=step]{border-color:var(--red);background:var(--red-t)}
.steps .n{font-family:var(--f-mono);font-weight:600}

/* loops */
.loop{display:flex;flex-wrap:wrap;gap:8px 4px;align-items:center}
.lnode{border:1.5px solid var(--line);border-radius:10px;padding:4px 10px;background:var(--bg);font-size:14px}
.sign{font-family:var(--f-mono);font-weight:700;width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;background:var(--soft)}
.sign.minus{background:var(--red-t);color:var(--ink)}
.rb{font-family:var(--f-mono);font-weight:700;border-radius:8px;padding:2px 10px;color:#fff}
.rb.R{background:var(--red)} .rb.B{background:var(--teal)}
[data-theme=dark] .rb,:root .rb{color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .rb{color:#0c1525}}
:root[data-theme="dark"] .rb{color:#0c1525}

/* features */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 12px;font-size:13.5px;font-weight:600;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.feat{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.fc{border:1.5px solid var(--line);border-left-width:6px;border-radius:12px;background:var(--panel);padding:10px 12px;display:grid;gap:4px}
.fc h4{margin:0;font-size:15px;font-weight:700}
.fc p{font-size:13.5px;color:var(--muted)}
.fc .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.count{font-family:var(--f-mono);font-size:13px;color:var(--muted)}

/* two tier */
.tier{display:grid;gap:8px}
.tier ul{margin:0;padding-left:18px;color:var(--muted)}
.link-bar{border:2px dashed var(--ink);border-radius:12px;padding:10px 14px;text-align:center;background:var(--panel)}

/* drawers */
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(420px,100%);background:var(--panel);border-left:1.5px solid var(--line);z-index:50;padding:calc(env(safe-area-inset-top,0px) + 18px) max(18px,env(safe-area-inset-right,0px)) 18px 18px;overflow:auto;display:grid;gap:12px;align-content:start;box-shadow:-12px 0 30px rgba(0,0,0,.12)}
.drawer h2{font-size:20px}
.drawer textarea{width:100%;min-height:200px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);padding:10px 12px;resize:vertical}
.prompt{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);display:grid;gap:6px}
.prompt p{font-size:13px;color:var(--muted);max-height:6.5em;overflow:auto}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:28px;padding-top:16px;border-top:1px solid var(--line)}
.nav .btn{padding:9px 18px;font-size:15px}
.mini{font-size:13px;color:var(--muted)}

  if(!S.db){$('#notest')&&($('#notest').textContent='Not saved in this view');return;}
  if(noteSaving){noteTimer=setTimeout(saveNote.bind(null,id),400);return;}
  noteSaving=true;try{await S.db.doc('notes/'+id).set({text:S.notes[id]||'',at:Date.now()});var e=$('#notest');if(e)e.textContent='Saved';}catch(e){var e2=$('#notest');if(e2)e2.textContent='Not saved ('+((e&&e.code)||'error')+')';}noteSaving=false;
}

/* pictures */
var fileIn=document.createElement('input');fileIn.type='file';fileIn.accept='image/*';fileIn.hidden=true;document.body.appendChild(fileIn);
var pendingSlot=null;
function pickFile(slot){pendingSlot=slot;fileIn.value='';fileIn.click();}
fileIn.addEventListener('change',function(){if(fileIn.files[0]&&pendingSlot)uploadImage(pendingSlot,fileIn.files[0]);});
async function uploadImage(slot,file){
  if(!S.assets||!S.db)return;
  var box=$('[data-slot="'+slot+'"] .mini');if(box)box.textContent='Uploading…';
  try{var r=await S.assets.upload(file);await S.db.doc('images/'+slot).set({url:r.url,id:r.id,name:file.name,at:Date.now()});}
  catch(e){if(box)box.textContent='Could not upload ('+((e&&e.code)||'error')+')';}
}
document.addEventListener('dragover',function(ev){var s=ev.target.closest&&ev.target.closest('.slot');if(s&&S.assets){ev.preventDefault();s.classList.add('over');}});
document.addEventListener('dragleave',function(ev){var s=ev.target.closest&&ev.target.closest('.slot');if(s)s.classList.remove('over');});
document.addEventListener('drop',function(ev){var s=ev.target.closest&&ev.target.closest('.slot');if(!s)return;ev.preventDefault();s.classList.remove('over');var f=ev.dataTransfer&&ev.dataTransfer.files&&ev.dataTransfer.files[0];if(f&&/^image\//.test(f.type)&&S.assets)uploadImage(s.getAttribute('data-slot'),f);});

/* ---------------- boot ---------------- */
(function(){
  var h=location.hash.slice(1),i=STEPS.map(function(s){return s.id;}).indexOf(h);if(i>-1)S.step=i;
  render();
  if(!(window.claude&&window.claude.use))return;
  window.claude.use('db').then(function(db){
    if(!db)return;S.db=db;
    db.collection('images').onSnapshot(function(snap){S.images={};snap.docs.forEach(function(d){if(d.exists){S.images[d.id]=d.data();}});render(true);if(!$('#dpics').hidden)renderPics();},function(){});
    db.collection('notes').onSnapshot(function(snap){var ae=document.activeElement;snap.docs.forEach(function(d){if(d.exists&&!(ae&&ae.id==='notetxt'&&STEPS[S.step].id===d.id))S.notes[d.id]=(d.data()||{}).text||'';});if($('#dnotes')&&!$('#dnotes').hidden&&!(ae&&ae.id==='notetxt'))renderNotes();},function(){});
    return window.claude.use('assets').then(function(a){S.assets=a;render(true);});
  }).catch(function(){});
})();
})();
</script>

</body></html>
